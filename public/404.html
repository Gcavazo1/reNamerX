<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>reNamerX - Redirecting...</title>
    <script>
      // For GitHub Pages SPA routing
      (function() {
        // Get current location and extract repository name
        var repo = '/reNamerX';
        var l = window.location;
        
        // Script detects that we're on a GitHub Pages site
        var isGitHub = l.hostname.includes('github.io');
        
        if (isGitHub) {
          // Extract the path that comes after the repo name
          var fullPath = l.pathname;
          var repoPath = repo + '/';
          var startPos = fullPath.indexOf(repoPath) + repoPath.length;
          var routePath = fullPath.substring(startPos);
          
          // Create the redirect URL with route parameter
          var redirectUrl = l.protocol + '//' + l.hostname + repo + '/?route=' + 
                          encodeURIComponent(routePath) + l.search + l.hash;
          
          console.log('Redirecting from', fullPath, 'to', redirectUrl);
          
          // Redirect to the home page with the route parameter
          window.location.replace(redirectUrl);
        }
      })();
    </script>
  </head>
  <body>
    <h1>Page Not Found</h1>
    <p>Redirecting to homepage...</p>
    <p>If you are not redirected automatically, <a href="/reNamerX/">click here</a>.</p>
  </body>
</html>
