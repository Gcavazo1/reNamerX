<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>reNamerX - Redirecting...</title>
    <script>
      // Single page apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL path and converts it to a path parameter
      // for the single page app base URL.
      const pathSegmentsToKeep = 1; // Keeps one segment (/reNamerX/)
      
      const l = window.location;
      const cleanUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      const baseUrl = cleanUrl + location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      const restOfUrl = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      const fullUrl = baseUrl + '/?route=' + encodeURIComponent(restOfUrl) + l.search + l.hash;
      
      window.history.replaceState(null, null, fullUrl);
      // Redirect to index.html
      window.location.href = fullUrl;
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>If you are not redirected automatically, click <a href="/">here</a>.</p>
  </body>
</html>
