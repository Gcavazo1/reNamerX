<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page not found - reNamerX</title>
    <script type="text/javascript">
      // Fix duplicate basePath issues and redirect to home page for 404s
      window.onload = function() {
        var path = window.location.pathname;
        
        // Fix duplicate basePath
        if (path.indexOf('/reNamerX/reNamerX/') !== -1) {
          path = path.replace('/reNamerX/reNamerX/', '/reNamerX/');
          window.location.href = window.location.origin + path + window.location.search + window.location.hash;
          return;
        }
        
        // If it's a 404 under the correct basePath, just go home
        if (path.indexOf('/reNamerX/') === 0) {
          window.location.href = window.location.origin + '/reNamerX/';
          return;
        }
        
        // Default fallback
        window.location.href = window.location.origin + '/reNamerX/';
      };
    </script>
  </head>
  <body>
    <h2>Redirecting to reNamerX home page...</h2>
  </body>
</html>
