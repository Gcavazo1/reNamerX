<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Page not found - reNamerX</title>
    <script type="text/javascript">
      // This script takes the current URL and fixes any issues with path duplication
      // Specifically handles the case of /reNamerX/reNamerX/... appearing in the URL
      
      window.onload = function() {
        var path = window.location.pathname;
        
        // Handle duplicate basePath
        if (path.indexOf('/reNamerX/reNamerX/') !== -1) {
          path = path.replace('/reNamerX/reNamerX/', '/reNamerX/');
          window.location.href = window.location.origin + path + window.location.search + window.location.hash;
          return;
        }
        
        // Handle missing pages by redirecting to home page
        if (path.indexOf('/reNamerX/') !== -1) {
          // This is a specific page that doesn't exist, redirect to home
          window.location.href = window.location.origin + '/reNamerX/';
          return;
        }
        
        // Fallback to home page
        window.location.href = window.location.origin + '/reNamerX/';
      };
    </script>
  </head>
  <body>
    <h2>Redirecting to reNamerX home page...</h2>
  </body>
</html>
