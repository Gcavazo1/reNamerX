name: Deploy to GitHub Pages

on:
  push:
    branches: [website]
  # Allow manual deployment
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          # Ensure it checks out the full repository
          fetch-depth: 0
      
      # Clear caches if they exist (as suggested by Copilot)
      - name: Clear caches
        run: |
          echo "Clearing any cached actions to prevent dependency issues"
          rm -rf ~/.cache/github-actions
          mkdir -p ~/.cache/github-actions
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          # Disable caching to avoid potential issues
          cache: false
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build:github
        env:
          GITHUB_PAGES: 'true'
      
      - name: Setup Pages
        uses: actions/configure-pages@v3
      
      # First, let's upload the build as a regular artifact using the v4.6.2 action
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: github-pages
          path: out
          retention-days: 1
      
      # Then, use the GitHub Pages specific artifact uploader
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './out'
  
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2 