name: Deploy to GitHub Pages

on:
  push:
    branches: [website]
  # Allow manual deployment
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Combined build and deploy job
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Clear caches if they exist (as suggested by Copilot)
      - name: Clear caches
        run: |
          echo "Clearing any cached actions to prevent dependency issues"
          rm -rf ~/.cache/github-actions
          mkdir -p ~/.cache/github-actions
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build and Export
        run: npm run build:github
        env:
          GITHUB_ACTIONS: true
          GITHUB_PAGES: 'true'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1.0.1
        with:
          path: 'out' # Ensure Next.js outputs to this folder
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1.0.1
